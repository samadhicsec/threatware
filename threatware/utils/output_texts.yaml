---
output-texts:
  default:
    information: "{{ translate.information }}"
    success: "{{ translate.success }}"
    error: "{{ translate.error }}"
    
    format-error: "The format parameter can only be 'json' or 'yaml' or 'html'"
    internal-error: "An internal error occurred, please see logs for more detail"

    scheme.unknown-scheme: "No scheme file for '{{ request.scheme }}' found.  Known schemes are: {{ scheme.known_schemes }}"
    scheme.no-schemes-defined: "No schemes have been defined in configuration file 'schemes/schemes.yaml'.  Please define at least one scheme."
    scheme.no-document-storage: "No 'document-storage' has been defined in the '{{ request.scheme }}' scheme configuration file.  Please define a 'document-storage' in the scheme."
    scheme.no-default-template: "No doctemplate request parameter was provided and no default document template has been defined in the '{{ request.scheme }}' scheme configuration file.  Please provide a doctemplate parameter or define a 'default-doctemplate' in the scheme."

    storage.no-git-repo: "No git remote repo was configured.  Please configure one.  Please see logs for more detail"
    storage.no-git-credentials: "The git repo configured uses the 'git@' protocol, but no git credentials have been configured."
    storage.clone-error: "There was an error executing git clone on '{{ storage.remote }}'"
    